[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
crossterm = "=0.29.0"
rustix = "=1.1.6"
mdtui3 = { package = "mdstream-core", path = "crates/mdstream-core" }
unicode-segmentation = "=1.13.3"
unicode-width = "=0.2.3"
insta = "=1.49.0"
portable-pty = "=0.9.0"
tempfile = "=3.27.0"
vt100 = "=0.18.1"

image = "=0.25.10"
ureq = "=3.5.2"
url = "=2.5.8"
base64 = "=0.23.1"
termion = "=4.0.6"
