[package]
name = "mdtui-tui"
version = "0.1.0"
edition = "2024"
description = "Terminal Markdown reader for mdtui3"

[dependencies]
crossterm = { version = "=0.29.0", default-features = false, features = ["events"] }
mdtui3 = { path = "../.." }

[dev-dependencies]
insta = { version = "=1.49.0", default-features = false }
portable-pty = "=0.9.0"
tempfile = "=3.27.0"
vt100 = "=0.18.1"
