[package]
name = "mdtui-tui"
version.workspace = true
edition.workspace = true
description = "Terminal Markdown reader for mdstream-core"

[dependencies]
crossterm = { workspace = true, default-features = false, features = ["events", "use-dev-tty"] }
mdtui3.workspace = true
rustix = { workspace = true, features = ["fs", "process", "event", "termios", "time"] }
unicode-segmentation.workspace = true
unicode-width = { workspace = true, default-features = false }

image = { workspace = true, default-features = false, features = ["png", "jpeg"] }
ureq = { workspace = true, default-features = false, features = ["rustls"] }
url.workspace = true
base64 = { workspace = true, default-features = false, features = ["alloc"] }
termion = { workspace = true, default-features = false }

[dev-dependencies]
insta = { workspace = true, default-features = false }
portable-pty.workspace = true
tempfile.workspace = true
vt100.workspace = true
